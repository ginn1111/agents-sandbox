[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-sandbox"
version = "0.1.0"
description = "Run AI coding agents in Docker, confined to one Workspace with Secret files masked."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
agent-sandbox = "agent_sandbox.cli:main"
asb = "agent_sandbox.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: end-to-end test that needs a real Docker daemon (skipped when absent)"]
